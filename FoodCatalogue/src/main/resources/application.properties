spring.application.name=food-catalogue

server.port=9092

eureka.client.service-url.defaultZone=http://localhost:8761/eureka
spring.datasource.url=jdbc:mysql://localhost:3306/food_registry_app
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

#Added this so that I don't have to hard code it
restaurant.service.url=http://RESTAURANT_SERVICE/restaurant

eureka.client.rest-template-timeout.eureka-connect-timeout=5000
eureka.client.rest-template-timeout.eureka-read-timeout=5000
spring.cloud.loadbalancer.ribbon.enabled=false

spring.cloud.loadbalancer.eager-load.clients=restaurant-service,user-information
eureka.client.webclient.enabled=false

eureka.client.rest-client.enabled=false